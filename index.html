<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[선수 닉네임] 응원 페이지</title>
    <!-- 팡파레(꽃가루) 효과를 위한 외부 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* 1. 둥둥 떠다니는 프로필 애니메이션 */
        .profile-section {
            text-align: center;
            margin-top: 30px;
            animation: floating 3s ease-in-out infinite;
        }
        .profile-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .profile-image:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* 2. 오버워치/e스포츠 감성의 글리치(Glitch) 텍스트 효과 */
        .glitch-title {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            position: relative;
            text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #0088ff,
                         0.025em 0.05em 0 #ff00ff;
            animation: glitch 1.5s infinite;
        }
        .subtitle { color: #45a29e; font-size: 15px; margin-bottom: 40px; font-weight: bold; }

        /* 카드 UI */
        .message-card {
            background: linear-gradient(145deg, #1f2833, #11151c);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            line-height: 1.8;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 네온 빛이 흐르는 버튼 */
        .action-btn {
            background: transparent;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .action-btn:hover, .action-btn.active {
            background: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px #66fcf1;
            transform: translateY(-3px);
        }

        /* 3. 숨겨진 편지 (타이핑 효과용 영역) */
        #hidden-letter {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(102, 252, 241, 0.05);
            border-top: 3px solid #66fcf1;
            width: 100%;
            max-width: 400px;
            line-height: 1.8;
            color: #ffffff;
            min-height: 100px;
        }
        #typing-text { font-size: 15px; word-break: keep-all; }
        .cursor { animation: blink 1s step-end infinite; }

        /* 키프레임 애니메이션 모음 */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #0088ff, 0.025em 0.05em 0 #ff00ff; }
            14% { text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #0088ff, 0.025em 0.05em 0 #ff00ff; }
            15% { text-shadow: -0.05em -0.025em 0 #00ffcc, 0.025em 0.025em 0 #0088ff, -0.05em -0.05em 0 #ff00ff; }
            49% { text-shadow: -0.05em -0.025em 0 #00ffcc, 0.025em 0.025em 0 #0088ff, -0.05em -0.05em 0 #ff00ff; }
            50% { text-shadow: 0.025em 0.05em 0 #00ffcc, 0.05em 0 0 #0088ff, 0 -0.05em 0 #ff00ff; }
            99% { text-shadow: 0.025em 0.05em 0 #00ffcc, 0.05em 0 0 #0088ff, 0 -0.05em 0 #ff00ff; }
            100% { text-shadow: -0.025em 0 0 #00ffcc, -0.025em -0.025em 0 #0088ff, -0.025em -0.05em 0 #ff00ff; }
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="profile-section">
        <!-- 💡 이곳에 선수 사진 링크를 넣어주세요 -->
        <img src="https://via.placeholder.com/160" alt="프로필 이미지" class="profile-image">
        <h1 class="glitch-title">[선수 닉네임]</h1>
        <p class="subtitle">최고의 플레이를 응원합니다 🎮</p>
    </div>

    <div class="message-card">
        <p>오늘 경기 정말 수고 많으셨습니다!</p>
        <p>항상 멋진 플레이 보여주셔서 감사해요.</p>
        <p>앞으로의 모든 무대도 진심으로 응원할게요.</p>
    </div>

    <button class="action-btn" onclick="openLetter(this)">숨겨진 편지 열기 💌</button>

    <div id="hidden-letter">
        <span id="typing-text"></span><span class="cursor">|</span>
    </div>

    <script>
        // 💡 이곳에 선수에게 전하고 싶은 실제 편지 내용을 적어주세요.
        const letterContent = "여기에 선수에게 전하고 싶은 긴 이야기나, 기억에 남았던 순간들에 대한 진심 어린 편지를 적어보세요. 텍스트가 게임 대화창처럼 한 글자씩 타이핑되며 나타납니다. 응원하는 마음이 잘 전달되길 바랄게요!";
        
        let isOpened = false;
        let typingInterval;

        function openLetter(btn) {
            const letterBox = document.getElementById('hidden-letter');
            const typingTarget = document.getElementById('typing-text');
            
            if (!isOpened) {
                isOpened = true;
                btn.classList.add('active');
                btn.innerText = '편지 닫기 ❌';
                letterBox.style.display = 'block';
                typingTarget.innerText = '';
                
                // 1. 팡파레(꽃가루) 효과 터뜨리기
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#66fcf1', '#0088ff', '#ffffff']
                });

                // 2. 타이핑 애니메이션 실행
                let i = 0;
                clearInterval(typingInterval);
                typingInterval = setInterval(() => {
                    if (i < letterContent.length) {
                        typingTarget.innerText += letterContent.charAt(i);
                        i++;
                    } else {
                        clearInterval(typingInterval);
                    }
                }, 50); // 숫자가 작을수록 글씨가 빨리 나타남 (현재 50ms)

            } else {
                isOpened = false;
                btn.classList.remove('active');
                btn.innerText = '숨겨진 편지 열기 💌';
                letterBox.style.display = 'none';
                clearInterval(typingInterval);
            }
        }
    </script>
</body>
</html>
